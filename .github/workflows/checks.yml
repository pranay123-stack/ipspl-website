name: Checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint

      # `npm run build` runs the breadcrumb, placeholder-image and SEO guards
      # itself, so this covers all three.
      - run: npm run build

      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
